<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Routines</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Top Nav -->
    <nav class="topnav">
        <div class="topnav-left">
            <div class="logo">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/>
                    <line x1="8" y1="23" x2="16" y2="23"/>
                </svg>
            </div>
            <span class="app-title">Voice Routines</span>
            <div class="nav-tabs">
                <button class="nav-tab active" data-view="canvas">Editor</button>
                <button class="nav-tab" data-view="logs">Executions</button>
            </div>
        </div>
        <div class="topnav-right">
            <span id="timing-display" class="timing-chip"></span>
            <span class="badge">On-Device</span>
        </div>
    </nav>

    <div class="app-body">
        <!-- Left Panel: Routines -->
        <aside class="sidebar">
            <div class="sidebar-section-title">ROUTINES</div>
            <div id="routine-list" class="routine-list"></div>
        </aside>

        <!-- Main Canvas -->
        <div class="main-area">
            <!-- Canvas / Flow view -->
            <div id="canvas-view" class="canvas-view">
                <div id="flow-container" class="flow-container">
                    <div class="canvas-empty" id="canvas-empty">
                        <div class="canvas-empty-icon">
                            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.4">
                                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                                <path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/>
                                <line x1="8" y1="23" x2="16" y2="23"/>
                            </svg>
                        </div>
                        <p class="canvas-empty-title">No routine selected</p>
                        <p class="canvas-empty-hint">Select a routine from the sidebar or create one with voice</p>
                    </div>
                </div>
            </div>

            <!-- Logs view (hidden by default) -->
            <div id="logs-view" class="logs-view hidden">
                <div id="execution-log" class="execution-log"></div>
            </div>

            <!-- Bottom Panel -->
            <div class="bottom-panel">
                <div class="bottom-panel-inner">
                    <!-- Chat / Input side -->
                    <div class="bottom-left">
                        <div class="bottom-section-label">Chat</div>
                        <div id="chat-messages" class="chat-messages"></div>
                        <div class="chat-input-row">
                            <button id="mic-btn" class="mic-btn" title="Click to record">
                                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                                    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                                    <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                                </svg>
                            </button>
                            <input type="text" id="text-input" class="chat-input" placeholder="Type a command or click mic..." />
                            <button id="send-btn" class="send-btn">
                                <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <!-- Logs side -->
                    <div class="bottom-right">
                        <div class="bottom-section-label">Latest Logs</div>
                        <div id="bottom-logs" class="bottom-logs"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast container -->
    <div id="toast-container" class="toast-container"></div>

    <script src="app.js"></script>
</body>
</html>
