<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Routines</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">
        <!-- Left Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Routines</h2>
            </div>
            <div id="routine-list" class="routine-list"></div>
        </aside>

        <!-- Center Panel -->
        <main class="center">
            <div class="center-header">
                <h1>Voice Routines</h1>
                <p class="subtitle">Speak to create, manage, and execute automations</p>
            </div>

            <div id="execution-log" class="execution-log">
                <div class="empty-state">
                    <div class="empty-icon">&#127908;</div>
                    <p>Tap the mic and speak a command</p>
                    <p class="hint">Try: "What's the weather in Tokyo"</p>
                    <p class="hint">Or: "Create a routine called morning: check weather in SF, play jazz, set timer for 10 minutes"</p>
                </div>
            </div>

            <!-- Bottom Bar -->
            <div class="bottom-bar">
                <div class="input-row">
                    <input type="text" id="text-input" class="text-input" placeholder="Type a command (or use the mic)..." />
                    <button id="send-btn" class="send-btn" title="Send">&#10148;</button>
                </div>
                <div class="mic-row">
                    <button id="mic-btn" class="mic-btn" title="Hold to record">
                        <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
                            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                        </svg>
                    </button>
                    <div class="mic-status">
                        <span id="mic-label">Click to record</span>
                        <canvas id="waveform" width="200" height="32"></canvas>
                    </div>
                </div>
                <div id="timing-display" class="timing-display"></div>
            </div>
        </main>
    </div>

    <!-- Toast container -->
    <div id="toast-container" class="toast-container"></div>

    <script src="app.js"></script>
</body>
</html>
